<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026 표준품셈 본문 검색</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; }
  body { display: flex; flex-direction: column; background: #f5f6f8; color: #222; }
  header { background: linear-gradient(135deg, #1a3a6c, #2563aa); color: #fff; padding: 10px 16px; box-shadow: 0 2px 6px rgba(0,0,0,.15); flex-shrink: 0; }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 .sub { font-size: 12px; opacity: .85; font-weight: 400; }
  .link-btn { background: linear-gradient(135deg, #b45309, #d97706); color: #fff; padding: 5px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; text-decoration: none; border: 1px solid rgba(255,255,255,.3); margin-left: auto; }
  .controls { margin-top: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .lbl { font-size: 11px; opacity: .85; font-weight: 600; }
  .book-btn, .tab-btn { padding: 6px 12px; background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.35); border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 700; }
  .book-btn.active { background: #f7c948; color: #1a3a6c; border-color: #f7c948; }
  select { padding: 6px 8px; border-radius: 6px; border: none; font-size: 12px; max-width: 320px; }
  .search-bar { flex: 1; min-width: 260px; display: flex; gap: 6px; align-items: center; margin-left: auto; }
  .search-bar input { flex: 1; padding: 8px 12px; border: none; border-radius: 6px; font-size: 14px; outline: none; }
  .count { background: rgba(255,255,255,.2); padding: 6px 10px; border-radius: 6px; font-size: 12px; white-space: nowrap; }
  main { display: flex; flex: 1; min-height: 0; }
  #sidebar { width: 360px; flex-shrink: 0; background: #fff; border-right: 1px solid #d8dce3; overflow-y: auto; }
  .chapter-divider { background: #1a3a6c; color: #fff; padding: 7px 12px; font-size: 12px; font-weight: 700; position: sticky; top: 0; z-index: 5; }
  .chapter-divider.telecom { background: #6b21a8; }
  .item { padding: 7px 12px; border-bottom: 1px solid #eef0f3; cursor: pointer; display: flex; gap: 6px; align-items: flex-start; font-size: 13px; line-height: 1.35; }
  .item:hover { background: #eef5ff; }
  .item.active { background: #d6e8ff; border-left: 4px solid #2563aa; padding-left: 8px; }
  .item.l3 { padding-left: 26px; } .item.l3.active { padding-left: 22px; }
  .item.l4 { padding-left: 40px; font-size: 12px; } .item.l4.active { padding-left: 36px; }
  .item .code { color: #2563aa; font-weight: 700; white-space: nowrap; font-size: 12px; }
  .item.telecom .code { color: #6b21a8; }
  .item .title { flex: 1; }
  .item .hit { font-size: 11px; color: #b45309; white-space: nowrap; }
  .item .img { font-size: 10px; color: #0a7f4f; border: 1px solid #0a7f4f; border-radius: 3px; padding: 0 3px; white-space: nowrap; }
  #content { flex: 1; min-width: 0; overflow-y: auto; padding: 16px 22px; }
  #imgpane { width: 44%; flex-shrink: 0; background: #e9ecf1; border-left: 1px solid #d8dce3; overflow-y: auto; padding: 10px; display: none; }
  #imgpane.on { display: block; }
  #imgpane img { width: 100%; display: block; margin-bottom: 10px; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
  #imgpane .pg { font-size: 11px; color: #555; margin: 4px 0 2px; }
  .empty { color: #777; padding: 40px; text-align: center; }
  .crumb { font-size: 12px; color: #666; margin-bottom: 4px; }
  h2.sec { margin: 0 0 6px; font-size: 20px; color: #1a3a6c; }
  h2.sec.telecom { color: #6b21a8; }
  .meta { font-size: 12px; color: #555; margin-bottom: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .meta .alt { color: #888; }
  .btn { padding: 5px 10px; border: 1px solid #b7bfca; background: #fff; border-radius: 6px; cursor: pointer; font-size: 12px; }
  .btn:hover { background: #eef5ff; }
  .btn.on { background: #1a3a6c; color: #fff; border-color: #1a3a6c; }
  .nav { display: flex; gap: 6px; margin-left: auto; }
  .p { white-space: pre-wrap; line-height: 1.6; font-size: 14px; margin: 6px 0; }
  .p.frag { border-left: 3px solid #d97706; padding-left: 8px; color: #7c2d12; background: #fff7ed; }
  .p.frag::before { content: '표 이탈 행 의심 · '; font-size: 11px; font-weight: 700; }
  .tbl-wrap { margin: 10px 0 14px; }
  .tbl-head { display: flex; gap: 8px; align-items: center; font-size: 12px; color: #555; margin-bottom: 4px; flex-wrap: wrap; }
  .badge { font-size: 11px; padding: 1px 6px; border-radius: 4px; font-weight: 700; }
  .badge.broken { background: #fde68a; color: #7c2d12; border: 1px solid #d97706; }
  .badge.split { background: #e0e7ff; color: #3730a3; }
  .badge.id { background: #eef0f3; color: #555; font-weight: 400; }
  table { border-collapse: collapse; font-size: 13px; background: #fff; }
  th, td { border: 1px solid #c8ced8; padding: 4px 8px; vertical-align: top; }
  th { background: #eef2f8; font-weight: 700; white-space: nowrap; }
  td.num { text-align: right; white-space: nowrap; }
  td.bad { background: #fff3c4; }
  details.note { margin: 10px 0; border: 1px solid #cfd6e0; border-radius: 6px; background: #fbfcfe; padding: 4px 10px; }
  details.note summary { cursor: pointer; font-weight: 700; color: #1a3a6c; font-size: 13px; padding: 4px 0; }
  details.note .p { font-size: 13px; }
  mark { background: #fff176; padding: 0 1px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1a3a6c; color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .help { font-size: 11px; color: #777; margin-top: 16px; border-top: 1px dashed #ccc; padding-top: 8px; }
  @media (max-width: 900px) { #sidebar { width: 240px; } #imgpane { width: 50%; } }
</style>
</head>
<body>
<header>
  <h1>2026 표준품셈 본문 검색 <span class="sub">전기공사·정보통신공사 — 텍스트 전문검색 · 표 열람 · 원본 쪽 이미지 대조</span>
    <a class="link-btn" href="../index.html">이미지판(기존)</a></h1>
  <div class="controls">
    <span class="lbl">공사</span>
    <button class="book-btn active" data-book="all">전체</button>
    <button class="book-btn" data-book="electric">전기공사</button>
    <button class="book-btn" data-book="telecom">통신공사</button>
    <span class="lbl">장</span>
    <select id="chapterSel"><option value="all">전체</option></select>
    <div class="search-bar">
      <input id="searchInput" type="search" placeholder="절번호·키워드 (띄어쓰기로 여러 단어 AND 검색, 본문·표 포함)" autocomplete="off">
      <span class="count" id="count"></span>
    </div>
  </div>
</header>
<main>
  <div id="sidebar"></div>
  <div id="content"><div class="empty">왼쪽 목록에서 항목을 선택하거나 검색하세요.<br><br>←/→ 이전·다음 항목, Ctrl+F 대신 상단 검색창을 쓰면 본문·표 안까지 찾습니다.</div></div>
  <div id="imgpane"></div>
</main>
<div class="toast" id="toast"></div>
<script src="data/manifest.js"></script>
<script>
(function () {
  const M = window.PUMSEM_MANIFEST;
  const IMG_DIR = { electric: '../pages/', telecom: '../telecom_pages/' };
  const BOOK_SHORT = { electric: '전기', telecom: '통신' };
  const sidebar = document.getElementById('sidebar');
  const content = document.getElementById('content');
  const imgpane = document.getElementById('imgpane');
  const searchInput = document.getElementById('searchInput');
  const countEl = document.getElementById('count');
  const chapterSel = document.getElementById('chapterSel');
  const toast = document.getElementById('toast');

  // ---------- 상태 ----------
  let book = 'all', chapter = 'all', query = '';
  let visible = [];            // 현재 목록(필터·검색 반영)의 manifest 항목
  let currentKey = null;       // 'electric:4-1'
  let showImg = true;
  const loaded = {};           // 'electric-4' -> Promise(payload)
  const index = {};            // key -> {norm, item}
  const keyOf = (m) => m.b + ':' + m.c;

  // ---------- 데이터 지연 로드 (script 태그: file:// 로 열어도 동작) ----------
  function loadChapter(b, ch) {
    const k = b + '-' + ch;
    if (loaded[k]) return loaded[k];
    loaded[k] = new Promise((resolve, reject) => {
      if (window.PUMSEM_DATA && window.PUMSEM_DATA[k]) return resolve(window.PUMSEM_DATA[k]);
      const s = document.createElement('script');
      s.src = 'data/' + k + '.js';
      s.onload = () => resolve(window.PUMSEM_DATA[k]);
      s.onerror = () => reject(new Error('로드 실패: ' + s.src));
      document.head.appendChild(s);
    });
    return loaded[k];
  }
  async function loadAll() {
    const ps = M.chapters.map(c => loadChapter(c.book, c.ch));
    const payloads = await Promise.all(ps);
    payloads.forEach(p => p.items.forEach(it => {
      const k = p.book + ':' + it.code;
      if (!index[k]) index[k] = { item: it, norm: norm(itemText(it)) };
    }));
  }

  // ---------- 검색 정규화 ----------
  const DOTS = /[·․‧ㆍ∙•]/g;
  function norm(s) {
    return s.normalize('NFKC').replace(DOTS, '·').replace(/[〃″]/g, '').toLowerCase().replace(/\s+/g, '');
  }
  function itemText(it) {
    const parts = [it.code, it.title, it.alt || ''];
    for (const b of it.blocks) {
      if (b.t === 'p') parts.push(b.x);
      else if (b.t === 'table') { parts.push(b.h.join(' ')); b.r.forEach(r => parts.push(r.join(' '))); if (b.u) parts.push(b.u); }
    }
    return parts.join('\n');
  }
  const UNIT_ALT = { 'mm2': '(?:mm2|㎟)', 'mm': '(?:mm|㎜)', 'cm': '(?:cm|㎝)', 'km': '(?:km|㎞)', 'kv': '(?:kv|㎸)', 'kw': '(?:kw|㎾)', 'm2': '(?:m2|㎡)', 'm3': '(?:m3|㎥)', 'kg': '(?:kg|㎏)', 'mhz': '(?:mhz|㎒)', 'khz': '(?:khz|㎑)', 'ghz': '(?:ghz|㎓)', 'ma': '(?:ma|㎃)', 'mw': '(?:mw|㎽)' };
  function flexRegex(term) {
    // 띄어쓰기·가운뎃점 변형·단위 기호 변형을 허용하는 강조용 정규식
    let t = term.normalize('NFKC').toLowerCase().replace(/\s+/g, '');
    let out = '';
    let i = 0;
    while (i < t.length) {
      let matched = false;
      for (const u of Object.keys(UNIT_ALT).sort((a, b) => b.length - a.length)) {
        if (t.startsWith(u, i)) { out += UNIT_ALT[u] + '\\s*'; i += u.length; matched = true; break; }
      }
      if (matched) continue;
      const c = t[i];
      if (/[·․‧ㆍ∙•]/.test(c)) out += '[·․‧ㆍ∙•]\\s*';
      else out += c.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*';
      i++;
    }
    return new RegExp(out.replace(/\\s\*$/, ''), 'gi');
  }
  function terms() { return query.trim().split(/\s+/).filter(Boolean); }

  // ---------- 목록 ----------
  function chapterOptions() {
    const cur = chapterSel.value;
    chapterSel.innerHTML = '<option value="all">전체</option>';
    M.chapters.filter(c => book === 'all' || c.book === book).forEach(c => {
      const o = document.createElement('option');
      o.value = c.book + '-' + c.ch;
      o.textContent = (book === 'all' ? BOOK_SHORT[c.book] + ' ' : '') + '제' + c.ch + '장 ' + c.title;
      chapterSel.appendChild(o);
    });
    chapterSel.value = [...chapterSel.options].some(o => o.value === cur) ? cur : 'all';
    chapter = chapterSel.value;
  }
  function baseList() {
    return M.items.filter(m => (book === 'all' || m.b === book) && (chapter === 'all' || (m.b + '-' + m.ch) === chapter));
  }
  async function renderList() {
    const ts = terms();
    let list = baseList();
    const hits = {};
    if (ts.length) {
      await loadAll();
      const nts = ts.map(norm);
      list = list.filter(m => {
        const e = index[keyOf(m)];
        if (!e) return false;
        if (!nts.every(t => e.norm.includes(t))) return false;
        let n = 0; nts.forEach(t => { let p = -1; while ((p = e.norm.indexOf(t, p + 1)) >= 0) n++; });
        hits[keyOf(m)] = n;
        return true;
      });
    }
    visible = list;
    const total = M.items.length;
    countEl.textContent = ts.length ? list.length + '건 일치 / ' + total + '개 항목' : list.length + '개 표시 / 총 ' + total + '개 항목';
    const frag = document.createDocumentFragment();
    let lastCh = null;
    list.forEach(m => {
      const chk = m.b + '-' + m.ch;
      if (chk !== lastCh) {
        const c = M.chapters.find(x => x.book === m.b && x.ch === m.ch);
        const d = document.createElement('div');
        d.className = 'chapter-divider ' + m.b;
        d.textContent = '[' + BOOK_SHORT[m.b] + '] 제' + m.ch + '장 ' + c.title;
        frag.appendChild(d); lastCh = chk;
      }
      const div = document.createElement('div');
      div.className = 'item ' + m.b + ' l' + m.l + (keyOf(m) === currentKey ? ' active' : '');
      div.dataset.key = keyOf(m);
      div.innerHTML = '<span class="code">' + esc(m.c) + '</span><span class="title">' + esc(m.t) + '</span>'
        + (m.i ? '<span class="img">쪽이미지</span>' : '')
        + (hits[keyOf(m)] ? '<span class="hit">' + hits[keyOf(m)] + '회</span>' : '');
      div.addEventListener('click', () => show(keyOf(m)));
      frag.appendChild(div);
    });
    sidebar.innerHTML = '';
    if (!list.length) sidebar.innerHTML = '<div class="empty">일치하는 항목이 없습니다.</div>';
    sidebar.appendChild(frag);
  }

  // ---------- 본문 ----------
  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
  function hl(s) {
    let h = esc(s);
    for (const t of terms()) {
      try { h = h.replace(flexRegex(t), m => '<mark>' + m + '</mark>'); } catch (e) { /* 정규식 실패 시 강조 생략 */ }
    }
    return h;
  }
  const isNum = (c) => /^[-+]?\d[\d,]*(\.\d+)?$/.test(c.trim()) || c.trim() === '-' || c.trim() === '〃';
  const isBad = (c) => !/[가-힣]/.test(c) && /(?<![\w.])\d+(?:\.\d+)?\s+\d+(?:\.\d+)?(?![\w.])/.test(c);
  function renderTable(b, idx) {
    let h = '<div class="tbl-wrap"><div class="tbl-head">';
    if (b.u) h += '<span>(단위 : ' + hl(b.u) + ')</span>';
    if (b.broken) h += '<span class="badge broken" title="한 칸에 숫자 여러 개가 뭉쳐 있어 직종·열 구분이 불확실합니다. 오른쪽 원본 쪽 이미지로 대조하세요.">표 열 분리 확인 필요 (' + b.broken + '행)</span>';
    if (b.split) h += '<span class="badge split" title="변환 시 좌표 기준으로 열을 나눈 표">좌표분리</span>';
    if (b.id) h += '<span class="badge id">' + esc(b.id) + '</span>';
    h += '<button class="btn" data-copy-table="' + idx + '">표 복사(엑셀용)</button></div>';
    h += '<table><thead><tr>' + b.h.map(c => '<th>' + hl(c) + '</th>').join('') + '</tr></thead><tbody>';
    for (const r of b.r) {
      h += '<tr>' + r.map(c => '<td class="' + (isNum(c) ? 'num' : '') + (isBad(c) ? ' bad' : '') + '">' + hl(c) + '</td>').join('') + '</tr>';
    }
    h += '</tbody></table></div>';
    return h;
  }
  function renderBlocks(blocks) {
    let h = ''; let inNote = false; let ti = 0;
    const open = () => { h += '<details class="note" open><summary>해설</summary>'; inNote = true; };
    const close = () => { if (inNote) { h += '</details>'; inNote = false; } };
    blocks.forEach(b => {
      if (b.t === 'note') { close(); open(); return; }
      if (inNote && !b.n) close();
      if (b.t === 'p') h += '<div class="p' + (b.frag ? ' frag' : '') + '">' + hl(b.x) + '</div>';
      else if (b.t === 'table') { h += renderTable(b, ti); ti++; }
    });
    close();
    return h;
  }
  let currentItem = null;
  async function show(key) {
    const [b, code] = key.split(':');
    const m = M.items.find(x => x.b === b && x.c === code);
    if (!m) return;
    const payload = await loadChapter(b, m.ch);
    const it = payload.items.find(x => x.code === code);
    currentKey = key; currentItem = it;
    location.hash = encodeURIComponent(key);
    const ch = M.chapters.find(x => x.book === b && x.ch === m.ch);
    let meta = [];
    if (it.img) meta.push('<span>원본 쪽 이미지 ' + it.img.length + '장 (p-' + it.img[0] + (it.img.length > 1 ? '~' + it.img[it.img.length - 1] : '') + ')' + (it.img_from ? ' <span class="alt">상위 ' + esc(it.img_from) + ' 범위</span>' : '') + '</span>');
    else meta.push('<span style="color:#b45309">원본 쪽 이미지 없음</span>');
    if (it.pdf) meta.push('<span>PDF p.' + it.pdf + (it.pdf_est ? ' (추정: 변환본 쪽−38)' : '') + '</span>');
    if (it.bp) meta.push('<span>책쪽 ' + it.bp + '</span>');
    if (it.alt) meta.push('<span class="alt">이미지판 제목: ' + esc(it.alt) + '</span>');
    let h = '<div class="crumb">[' + BOOK_SHORT[b] + '] ' + esc(M.books[b]) + ' › 제' + m.ch + '장 ' + esc(ch.title) + '</div>';
    h += '<h2 class="sec ' + b + '">' + esc(it.code) + ' ' + hl(it.title) + '</h2>';
    h += '<div class="meta">' + meta.join(' · ')
      + '<button class="btn" id="copyAll">본문 복사</button>'
      + '<button class="btn' + (showImg ? ' on' : '') + '" id="toggleImg"' + (it.img ? '' : ' disabled') + '>쪽 이미지 ' + (showImg ? '숨기기' : '보기') + '</button>'
      + '<span class="nav"><button class="btn" id="prevBtn">← 이전</button><button class="btn" id="nextBtn">다음 →</button></span></div>';
    h += renderBlocks(it.blocks);
    h += '<div class="help">수치는 변환본 기준입니다. "표 열 분리 확인 필요" 표시가 있는 표는 원본 쪽 이미지(이미지가 없으면 PDF 원문)로 반드시 대조하세요.</div>';
    content.innerHTML = h;
    content.scrollTop = 0;
    document.getElementById('copyAll').addEventListener('click', () => copyText(plainText(it), '본문을 복사했습니다'));
    document.getElementById('toggleImg').addEventListener('click', () => { showImg = !showImg; renderImgs(it); show(key); });
    document.getElementById('prevBtn').addEventListener('click', () => step(-1));
    document.getElementById('nextBtn').addEventListener('click', () => step(1));
    content.querySelectorAll('[data-copy-table]').forEach(btn => btn.addEventListener('click', () => {
      const tables = it.blocks.filter(x => x.t === 'table');
      copyText(tsv(tables[+btn.dataset.copyTable]), '표를 탭 구분 텍스트로 복사했습니다 (〃는 윗값으로 치환)');
    }));
    renderImgs(it);
    sidebar.querySelectorAll('.item').forEach(d => d.classList.toggle('active', d.dataset.key === key));
    const act = sidebar.querySelector('.item.active');
    if (act) act.scrollIntoView({ block: 'nearest' });
  }
  function renderImgs(it) {
    if (!showImg || !it.img) { imgpane.classList.remove('on'); imgpane.innerHTML = ''; return; }
    imgpane.classList.add('on');
    const dir = IMG_DIR[currentKey.split(':')[0]];
    imgpane.innerHTML = it.img.map(p => '<div class="pg">p-' + p + '</div><img src="' + dir + 'p-' + p + '.jpg" alt="p-' + p + '" loading="lazy">').join('');
  }
  function step(d) {
    const i = visible.findIndex(m => keyOf(m) === currentKey);
    const j = i + d;
    if (j < 0 || j >= visible.length) return;
    show(keyOf(visible[j]));
  }
  function tsv(b) {
    const rows = [b.h].concat(b.r.map(r => r.slice()));
    for (let i = 1; i < rows.length; i++) for (let j = 0; j < rows[i].length; j++) {
      if (/^[〃″]$/.test(rows[i][j].trim()) && i > 0) rows[i][j] = rows[i - 1][j];
    }
    return (b.u ? '(단위 : ' + b.u + ')\n' : '') + rows.map(r => r.map(c => c.replace(/\t/g, ' ')).join('\t')).join('\n');
  }
  function plainText(it) {
    const out = [it.code + ' ' + it.title];
    it.blocks.forEach(b => {
      if (b.t === 'note') out.push('【해설】');
      else if (b.t === 'p') out.push(b.x);
      else if (b.t === 'table') out.push(tsv(b));
    });
    return out.join('\n\n');
  }
  function copyText(s, msg) {
    const done = () => { toast.textContent = msg; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(s).then(done, () => fallback(s, done));
    else fallback(s, done);
  }
  function fallback(s, done) {
    const ta = document.createElement('textarea'); ta.value = s; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } finally { ta.remove(); }
  }

  // ---------- 이벤트 ----------
  document.querySelectorAll('.book-btn').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('.book-btn').forEach(x => x.classList.remove('active'));
    btn.classList.add('active'); book = btn.dataset.book; chapterOptions(); renderList();
  }));
  chapterSel.addEventListener('change', () => { chapter = chapterSel.value; renderList(); });
  let timer = null;
  searchInput.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(async () => {
      query = searchInput.value;
      await renderList();
      if (currentKey) show(currentKey);
    }, 250);
  });
  document.addEventListener('keydown', (e) => {
    if (e.target === searchInput || e.target.tagName === 'SELECT') return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
    if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
  });

  // ---------- 시작 ----------
  chapterOptions();
  renderList().then(() => {
    const h = decodeURIComponent(location.hash.replace(/^#/, ''));
    if (h && h.includes(':')) show(h);
  });
})();
</script>
</body>
</html>
